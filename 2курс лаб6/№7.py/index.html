<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Мой To-Do List</h1>

        <div class="input-row">

            <input
                id="taskInput"
                type="text"
                placeholder="Введите задачу"
            >

            <button id="addBtn">
                Добавить
            </button>

        </div>


        <div class="controls">

            <button id="clearCompleted">
                Очистить выполненные
            </button>

            <button id="clearAll">
                Удалить все
            </button>

        </div>


        <p id="counter">
            Всего задач: 0
        </p>


        <ul id="taskList"></ul>

    </div>


    <script src="script.js"></script>

</body>
</html>
